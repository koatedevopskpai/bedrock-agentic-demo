name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (mock mode — no AWS)
        run: pytest tests/ -q
      - name: CLI smoke (mock)
        run: python -m src.cli --mode mock --query "What is 15 times 27?"
      - name: Real Bedrock smoke (only with creds)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
        run: python -m src.cli --mode bedrock --query "Search bedrock"
